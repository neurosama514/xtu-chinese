name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  translations:
    name: 校验翻译表
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查 task_*/tr_* 是否一一对应
        run: python src/scripts/check_translations.py

  tools:
    name: 编译工具链
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 XtuBaml / XtuPatch
        shell: powershell
        run: |
          .\build.ps1 -Stage tools
          if (-not (Test-Path .\build\XtuBaml.exe)) { throw "XtuBaml.exe 未生成" }
          if (-not (Test-Path .\build\XtuPatch.exe)) { throw "XtuPatch.exe 未生成" }
      - uses: actions/upload-artifact@v4
        with:
          name: tools
          path: build/
          retention-days: 7

  # 完整构建需要本机已安装 XTU 7.14.2.135 与 vendor\XTUSetup_*.exe，
